<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Hours Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e5e3dc;--acc:#2f6f5e;--accsoft:#dcebe5;--danger:#b4372f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--card:#1e2225;--ink:#eceae4;--mute:#9aa0a6;--line:#2e3337;--acc:#5fb59c;--accsoft:#233a33;--danger:#e0766e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181a;--card:#1e2225;--ink:#eceae4;--mute:#9aa0a6;--line:#2e3337;--acc:#5fb59c;--accsoft:#233a33;--danger:#e0766e;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 16px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.timer{font-size:52px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;margin:6px 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select{flex:1;min-width:0;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
button{padding:10px 16px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.alt{background:var(--accsoft);color:var(--acc)}
button.big{width:100%;margin-top:10px;padding:13px}
button.stop{background:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}
.bar{height:8px;background:var(--accsoft);border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--acc);width:0}
.small{font-size:13px;color:var(--mute);margin-top:6px}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.col div{width:100%;background:var(--acc);border-radius:6px 6px 0 0;min-height:2px}
.log{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.log:first-of-type{border-top:0}
.log small{color:var(--mute);display:block}
.log button{background:none;color:var(--mute);padding:4px 8px;font-weight:400}
</style>
</head>
<body>
<main>
<h1>📚 Study Hours Tracker</h1>

<div class="card">
  <div class="timer" id="clock">00:00:00</div>
  <select id="subject" aria-label="Subject"></select>
  <button class="big" id="toggle">Start studying</button>
</div>

<div class="card">
  <h2>Rest</h2>
  <div class="timer" id="restClock" style="font-size:34px">--:--</div>
  <div class="row"><input id="restMin" type="number" min="1" value="30" style="max-width:90px;flex:none" aria-label="Rest minutes"><button class="alt" id="restBtn" style="flex:1">Start rest</button></div>
  <div class="small" id="restNote">You will get a notification when your rest is over.</div>
</div>

<div class="card">
  <div class="stats">
    <div class="stat"><b id="sToday">0h 0m</b><span>Today</span></div>
    <div class="stat"><b id="sWeek">0h 0m</b><span>Last 7 days</span></div>
    <div class="stat"><b id="sTotal">0h 0m</b><span>Total</span></div>
  </div>
  <div class="bar"><i id="goalBar"></i></div>
  <div class="small">Daily goal: <input id="goal" type="number" min="0" step="0.5" value="2" style="width:70px;flex:none;padding:4px 8px"> hours · <span id="goalTxt"></span></div>
</div>

<div class="card">
  <h2>Last 7 days</h2>
  <div class="chart" id="chart"></div>
</div>

<div class="card">
  <h2>Time by subject</h2>
  <div id="subjList"></div>
</div>

<div class="card">
  <h2>Add time manually</h2>
  <div class="row">
    <select id="mSub" aria-label="Subject" style="flex:2 1 160px"></select>
    <input id="mH" type="number" min="0" placeholder="Hours" style="max-width:80px;flex:none">
    <input id="mM" type="number" min="0" max="59" placeholder="Min" style="max-width:80px;flex:none">
    <button class="alt" id="add">Add</button>
  </div>
</div>

<div class="card">
  <h2>Recent sessions</h2>
  <div id="log"></div>
</div>
<div class="small" id="saveNote"></div>
</main>

<script>
const $ = id => document.getElementById(id);
let data = {sessions: [], goal: 2, running: null};
let ref = null, tick = null;

const SUBJECTS = ["Physics","Chemistry","General Math","Higher Math","Biology","Bangla 1st Paper","Bangla 2nd Paper","English 1st Paper","English 2nd Paper","Religion","Bangladesh & Global Studies (B.G.S)"];
["subject","mSub"].forEach(id => {
  $(id).innerHTML = '<option value="">Select subject</option>' + SUBJECTS.map(s => '<option>'+s+'</option>').join("");
});
const fmt = m => { m = Math.round(m); return Math.floor(m/60) + "h " + (m%60) + "m"; };
const dayKey = t => { const d = new Date(t); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };

async function load(){
  try {
    const user = await claude.use("user"), db = await claude.use("db");
    if (user && db) {
      const id = await user.id();
      if (id) {
        ref = db.collection("data/users/" + id).doc("study");
        const s = await ref.get();
        if (s.exists) data = Object.assign(data, s.data());
        $("saveNote").textContent = "Saved.";
        return;
      }
    }
  } catch(e) {}
  try { const raw = localStorage.getItem("study-data"); if (raw) data = Object.assign(data, JSON.parse(raw)); } catch(e) {}
  $("saveNote").textContent = "Saved in this browser only.";
}
async function save(){
  try { if (ref) { await ref.set(data); return; } } catch(e) {}
  try { localStorage.setItem("study-data", JSON.stringify(data)); } catch(e) {}
}

function render(){
  const now = Date.now(), today = dayKey(now);
  const per = {}; let total = 0;
  data.sessions.forEach(s => { const k = dayKey(s.start); per[k] = (per[k]||0) + s.mins; total += s.mins; });
  let week = 0; const days = [];
  for (let i = 6; i >= 0; i--) {
    const t = now - i*864e5, k = dayKey(t), v = per[k]||0; week += v;
    days.push({l: new Date(t).toLocaleDateString(undefined,{weekday:"short"}), v});
  }
  $("sToday").textContent = fmt(per[today]||0);
  $("sWeek").textContent = fmt(week);
  $("sTotal").textContent = fmt(total);
  const goalMin = (data.goal||0)*60, pct = goalMin ? Math.min(100, (per[today]||0)/goalMin*100) : 0;
  $("goalBar").style.width = pct + "%";
  $("goalTxt").textContent = goalMin ? (pct >= 100 ? "Goal reached 🎉" : fmt(goalMin-(per[today]||0)) + " to go") : "no goal set";
  const max = Math.max(60, ...days.map(d => d.v));
  $("chart").innerHTML = days.map(d => '<div class="col"><div style="height:'+(d.v/max*100)+'%"></div>'+d.l+'</div>').join("");
  const bySub = {}; data.sessions.forEach(s => { const k = s.subject || "Other"; bySub[k] = (bySub[k]||0) + s.mins; });
  const names = SUBJECTS.concat(Object.keys(bySub).filter(k => !SUBJECTS.includes(k)));
  const top = Math.max(1, ...names.map(n => bySub[n]||0));
  $("subjList").innerHTML = names.map(n => '<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+n.replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</span><b>'+fmt(bySub[n]||0)+'</b></div><div class="bar" style="margin-top:4px;height:6px"><i style="width:'+((bySub[n]||0)/top*100)+'%"></i></div></div>').join("");
  const list = data.sessions.slice().sort((a,b) => b.start-a.start).slice(0, 15);
  $("log").innerHTML = list.length ? "" : '<div class="small">No sessions yet. Start the timer!</div>';
  list.forEach(s => {
    const el = document.createElement("div"); el.className = "log";
    const l = document.createElement("div");
    l.textContent = s.subject || "Study";
    const sm = document.createElement("small");
    sm.textContent = new Date(s.start).toLocaleDateString(undefined,{month:"short",day:"numeric"}) + " · " + fmt(s.mins);
    l.appendChild(sm);
    const b = document.createElement("button"); b.textContent = "✕"; b.setAttribute("aria-label","Delete");
    b.onclick = () => { data.sessions = data.sessions.filter(x => x.id !== s.id); save(); render(); };
    el.append(l, b); $("log").appendChild(el);
  });
  const running = !!data.running;
  $("toggle").textContent = running ? "Stop & save" : "Start studying";
  $("toggle").classList.toggle("stop", running);
  if (running) $("subject").value = data.running.subject;
}

function clock(){
  if (!data.running) { $("clock").textContent = "00:00:00"; return; }
  const s = Math.floor((Date.now() - data.running.start)/1000);
  $("clock").textContent = [s/3600|0, (s%3600)/60|0, s%60].map(n => String(n).padStart(2,"0")).join(":");
}

$("toggle").onclick = () => {
  if (data.running) {
    const mins = (Date.now() - data.running.start)/60000;
    if (mins >= 0.1) data.sessions.push({id: String(Date.now()), subject: data.running.subject, start: data.running.start, mins});
    data.running = null; clearInterval(tick);
  } else {
    if (!$("subject").value) { $("subject").focus(); return; }
    if (data.restEnd) cancelRest();
    data.running = {start: Date.now(), subject: $("subject").value};
    tick = setInterval(clock, 1000);
  }
  save(); render(); clock();
};
const LN = () => (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.LocalNotifications) || null;
async function startRest(){
  if (data.running) $("toggle").onclick();
  const mins = Math.max(1, +$("restMin").value || 30);
  data.restEnd = Date.now() + mins*60000; save();
  const ln = LN();
  if (ln) { try {
    let p = await ln.checkPermissions();
    if (p.display !== "granted") p = await ln.requestPermissions();
    await ln.createChannel({id:"rest", name:"Rest reminders", importance:5, vibration:true});
    await ln.schedule({notifications:[{id:1001, channelId:"rest", title:"Time to study! \ud83d\udcda", body:"Your "+mins+" minute rest is over.", schedule:{at:new Date(data.restEnd), allowWhileIdle:true}}]});
  } catch(e) { $("restNote").textContent = "Could not schedule notification: " + e; } }
  restTick();
}
async function cancelRest(){
  data.restEnd = null; save();
  const ln = LN(); if (ln) { try { await ln.cancel({notifications:[{id:1001}]}); } catch(e) {} }
  restTick();
}
function restTick(){
  if (data.restEnd) {
    const left = data.restEnd - Date.now();
    if (left <= 0) {
      data.restEnd = null; save();
      try { navigator.vibrate && navigator.vibrate([400,150,400]); } catch(e) {}
      $("restNote").textContent = "Rest is over. Time to study!";
    } else {
      const s = Math.ceil(left/1000);
      $("restClock").textContent = String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    }
  }
  if (!data.restEnd) $("restClock").textContent = "--:--";
  $("restBtn").textContent = data.restEnd ? "Cancel rest" : "Start rest";
}
$("restBtn").onclick = () => data.restEnd ? cancelRest() : startRest();
setInterval(restTick, 1000);
$("add").onclick = () => {
  const mins = (+$("mH").value||0)*60 + (+$("mM").value||0);
  if (mins <= 0 || !$("mSub").value) return;
  data.sessions.push({id: String(Date.now()), subject: $("mSub").value, start: Date.now(), mins});
  $("mSub").value = $("mH").value = $("mM").value = "";
  save(); render();
};
$("goal").onchange = () => { data.goal = Math.max(0, +$("goal").value||0); save(); render(); };

(async () => {
  render();
  await load();
  $("goal").value = data.goal;
  render(); clock(); restTick();
  if (data.running) tick = setInterval(clock, 1000);
})();
</script>
</body>
</html>
